name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mutation
      - run: npm run test:cli
      - run: npm run demo:offline
      - run: npm run eval:offline
      - run: npm run replay:offline
      - run: npm run test:participation-mutation
      - run: npm run test:conversation
      - run: npm run test:live-terminal
      # No vault login, runtime secret injection or paid provider call in CI.
